name: WorkPluse frontend production promotion

on:
  workflow_dispatch:
    inputs:
      alpha_sha:
        description: Full commit SHA already deployed and tested on Alpha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workpulse-frontend-production
  cancel-in-progress: false

jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.alpha_sha }}
      NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify selected commit is on Alpha
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin alpha
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/alpha
          git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - name: Validate production API URL and build
        run: |
          set -euo pipefail
          [[ "$NEXT_PUBLIC_API_URL" =~ ^https://[^[:space:]]+$ ]]
          npm run build

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require production settings
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
          API_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" && test -n "$REGION" && test -n "$INSTANCE_ID" && test -n "$API_URL"
          test "$INSTANCE_ID" = "i-0daa3d70474ad0ee2"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify frontend SSM node is Online
        env:
          INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
        run: |
          set -euo pipefail
          STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)
          test "$STATUS" = Online
      - name: Deploy selected Alpha commit through SSM
        env:
          INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
          RELEASE_SHA: ${{ inputs.alpha_sha }}
          API_URL: ${{ vars.PROD_API_BASE_URL }}
          DEPLOY_SCRIPT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT_URL="https://raw.githubusercontent.com/kerplunkdeveloper-lgtm/Workpluse_frontend/$DEPLOY_SCRIPT_SHA/ops/deploy-production.sh"
          SCRIPT_PATH="/tmp/workpulse-frontend-deploy-$RELEASE_SHA.sh"
          printf -v INNER 'curl -fsSL %q -o %q && bash %q %q %q' "$SCRIPT_URL" "$SCRIPT_PATH" "$SCRIPT_PATH" "$RELEASE_SHA" "$API_URL"
          printf -v REMOTE 'sudo -iu ubuntu bash -lc %q' "$INNER"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMETERS" --timeout-seconds 2400 --query Command.CommandId --output text)
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            if [[ "$STATUS" == Success ]]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
              exit 0
            fi
            case "$STATUS" in Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json; exit 1;; esac
            sleep 10
          done
          echo 'Timed out waiting for frontend deployment' >&2
          exit 1
