
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - name: UI audit (layout, crashes, placeholder text, contrast)
        run: npm run audit:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: UI audit, dark theme
        run: npm run audit:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
          THEME: dark

  deploy_alpha:
    name: Deploy Frontend Alpha
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    environment: alpha
    timeout-minutes: 35

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check GitHub OIDC Identity
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          JWT=$(printf '%s' "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(printf '%s' "$JWT" | cut -d '.' -f 2)

          OIDC_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import os
          import json
          import base64

          payload = os.environ["OIDC_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for field in ("iss", "aud", "sub"):
              print(f"{field}: {claims.get(field)}")
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through AWS SSM
        env:
          INSTANCE_ID: ${{ vars.ALPHA_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"sudo -iu ubuntu /home/ubuntu/bin/deploy-alpha-frontend.sh ${DEPLOY_SHA}\"]}" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Frontend deployment successful"
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Details:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment did not complete before timeout"
          exit 1
